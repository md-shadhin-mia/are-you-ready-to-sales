name: Build and Push Docker Images to Docker Hub

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      service:
        description: "Specific service to build (default: all)"
        type: choice
        options:
          - all
          - api
          - storefront
          - student-dashboard
          - admin-dashboard
          - nginx-gateway
        default: all
      version:
        description: "Custom version tag (e.g. v1.0.0, 1.2.3, beta-1). Defaults to latest + commit SHA."
        required: false
        default: "latest"
      push:
        description: "Push to Docker Hub (true/false)"
        type: boolean
        required: true
        default: true

env:
  DOCKERHUB_REPO: mdshadhinkn/artifact

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      compose_services: ${{ steps.set-matrix.outputs.compose_services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Path Filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/db/**'
              - 'packages/api-client/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/docker-build-push.yml'
            storefront:
              - 'apps/storefront/**'
              - 'packages/ui/**'
              - 'packages/api-client/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/docker-build-push.yml'
            student-dashboard:
              - 'apps/student-dashboard/**'
              - 'packages/ui/**'
              - 'packages/api-client/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/docker-build-push.yml'
            admin-dashboard:
              - 'apps/admin-dashboard/**'
              - 'packages/ui/**'
              - 'packages/api-client/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/docker-build-push.yml'
            nginx-gateway:
              - 'docker/nginx/**'
              - '.github/workflows/docker-build-push.yml'

      - name: Construct Dynamic Build Matrix
        id: set-matrix
        run: |
          IS_DISPATCH="${{ github.event_name == 'workflow_dispatch' }}"
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/v') }}"

          API="${{ steps.filter.outputs.api }}"
          STOREFRONT="${{ steps.filter.outputs.storefront }}"
          STUDENT="${{ steps.filter.outputs.student-dashboard }}"
          ADMIN="${{ steps.filter.outputs.admin-dashboard }}"
          NGINX="${{ steps.filter.outputs.nginx-gateway }}"

          # On release tags or manual workflow_dispatch
          if [ "$IS_TAG" = "true" ]; then
            API="true"; STOREFRONT="true"; STUDENT="true"; ADMIN="true"; NGINX="true"
          elif [ "$IS_DISPATCH" = "true" ]; then
            TARGET="${{ github.event.inputs.service }}"
            if [ -n "$TARGET" ] && [ "$TARGET" != "all" ]; then
              API="false"; STOREFRONT="false"; STUDENT="false"; ADMIN="false"; NGINX="false"
              case "$TARGET" in
                api) API="true" ;;
                storefront) STOREFRONT="true" ;;
                student-dashboard) STUDENT="true" ;;
                admin-dashboard) ADMIN="true" ;;
                nginx-gateway) NGINX="true" ;;
              esac
            else
              API="true"; STOREFRONT="true"; STUDENT="true"; ADMIN="true"; NGINX="true"
            fi
          fi

          echo "Detected changes:"
          echo "  API: $API"
          echo "  Storefront: $STOREFRONT"
          echo "  Student Dashboard: $STUDENT"
          echo "  Admin Dashboard: $ADMIN"
          echo "  Nginx Gateway: $NGINX"

          MATRIX_ITEMS=()
          COMPOSE_SERVICES=()
          if [ "$API" = "true" ]; then
            MATRIX_ITEMS+=('{"name":"api","type":"backend","dockerfile":"apps/api/Dockerfile","context":"."}')
            COMPOSE_SERVICES+=("api")
          fi
          if [ "$STOREFRONT" = "true" ]; then
            MATRIX_ITEMS+=('{"name":"storefront","type":"frontend","dockerfile":"apps/storefront/Dockerfile","context":"."}')
            COMPOSE_SERVICES+=("storefront")
          fi
          if [ "$STUDENT" = "true" ]; then
            MATRIX_ITEMS+=('{"name":"student-dashboard","type":"frontend","dockerfile":"apps/student-dashboard/Dockerfile","context":"."}')
            COMPOSE_SERVICES+=("student-dashboard")
          fi
          if [ "$ADMIN" = "true" ]; then
            MATRIX_ITEMS+=('{"name":"admin-dashboard","type":"frontend","dockerfile":"apps/admin-dashboard/Dockerfile","context":"."}')
            COMPOSE_SERVICES+=("admin-dashboard")
          fi
          if [ "$NGINX" = "true" ]; then
            MATRIX_ITEMS+=('{"name":"nginx-gateway","type":"gateway","dockerfile":"docker/nginx/Dockerfile","context":"."}')
            COMPOSE_SERVICES+=("nginx")
          fi

          if [ ${#MATRIX_ITEMS[@]} -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "compose_services=" >> $GITHUB_OUTPUT
            echo "No relevant services changed. Skipping build."
          else
            JOINED=$(IFS=,; echo "${MATRIX_ITEMS[*]}")
            JSON="{\"include\":[${JOINED}]}"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "matrix=${JSON}" >> $GITHUB_OUTPUT
            echo "compose_services=${COMPOSE_SERVICES[*]}" >> $GITHUB_OUTPUT
            echo "Build matrix: ${JSON}"
            echo "Target compose services: ${COMPOSE_SERVICES[*]}"
          fi

  build-and-push:
    name: Build & Push ${{ matrix.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ github.event.inputs.push != 'false' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'mdshadhinkn' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute Image Tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # Determine version tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ] && [ "${{ github.event.inputs.version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${SHORT_SHA}"
          fi

          PREFIX="aurts"
          TYPE="${{ matrix.type }}"
          NAME="${{ matrix.name }}"
          REPO="${{ env.DOCKERHUB_REPO }}"

          # Build comma-separated tag list with aurts prefix
          # 1. Type + Name + Latest: mdshadhinkn/artifact:aurts-backend-api-latest
          # 2. Type + Name + Version: mdshadhinkn/artifact:aurts-backend-api-v1.0.0 (or short sha)
          # 3. Name + Latest: mdshadhinkn/artifact:aurts-api-latest
          # 4. Name + Version: mdshadhinkn/artifact:aurts-api-v1.0.0 (or short sha)
          TAG_LIST="${REPO}:${PREFIX}-${TYPE}-${NAME}-latest"
          TAG_LIST="${TAG_LIST},${REPO}:${PREFIX}-${TYPE}-${NAME}-${VERSION}"
          TAG_LIST="${TAG_LIST},${REPO}:${PREFIX}-${NAME}-latest"
          TAG_LIST="${TAG_LIST},${REPO}:${PREFIX}-${NAME}-${VERSION}"

          # Add nginx aliases if name is nginx-gateway
          if [ "${NAME}" = "nginx-gateway" ]; then
            TAG_LIST="${TAG_LIST},${REPO}:${PREFIX}-gateway-nginx-latest"
            TAG_LIST="${TAG_LIST},${REPO}:${PREFIX}-gateway-nginx-${VERSION}"
            TAG_LIST="${TAG_LIST},${REPO}:${PREFIX}-nginx-latest"
            TAG_LIST="${TAG_LIST},${REPO}:${PREFIX}-nginx-${VERSION}"
          fi

          # Add commit SHA tag if version was a semver tag
          if [ "${VERSION}" != "${SHORT_SHA}" ]; then
            TAG_LIST="${TAG_LIST},${REPO}:${PREFIX}-${TYPE}-${NAME}-${SHORT_SHA}"
            TAG_LIST="${TAG_LIST},${REPO}:${PREFIX}-${NAME}-${SHORT_SHA}"
            if [ "${NAME}" = "nginx-gateway" ]; then
              TAG_LIST="${TAG_LIST},${REPO}:${PREFIX}-gateway-nginx-${SHORT_SHA}"
              TAG_LIST="${TAG_LIST},${REPO}:${PREFIX}-nginx-${SHORT_SHA}"
            fi
          fi

          echo "tags=${TAG_LIST}" >> $GITHUB_OUTPUT
          echo "Computed tags for ${NAME}:"
          echo "${TAG_LIST}" | tr ',' '\n'

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event.inputs.push != 'false' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to Server
    needs: [detect-changes, build-and-push]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Configuration
        id: check-config
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || ( [ -z "${{ secrets.SSH_KEY }}" ] && [ -z "${{ secrets.SSH_PASSWORD }}" ] ); then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice ::SSH_HOST and either SSH_KEY or SSH_PASSWORD must be configured. Skipping automated remote deployment."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Selective Service(s) via SSH
        if: steps.check-config.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_SERVICES: ${{ needs.detect-changes.outputs.compose_services }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: TARGET_SERVICES,DEPLOY_PATH
          script: |
            set -e
            TARGET_DIR="${DEPLOY_PATH:-$HOME}"
            TARGET_DIR="${TARGET_DIR/#\~/$HOME}"
            cd "$TARGET_DIR"
            echo "=========================================="
            echo "🚀 Continuous Deployment: Selective Update"
            echo "📅 Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "🎯 Target Services: ${TARGET_SERVICES}"
            echo "=========================================="

            # Locate compose file (prioritizing docker-compose.yml as configured on the server)
            COMPOSE_FILE=""
            if [ -f "docker-compose.yml" ]; then
              COMPOSE_FILE="docker-compose.yml"
            elif [ -f "docker-compose.hub.yml" ]; then
              COMPOSE_FILE="docker-compose.hub.yml"
            fi

            if [ -z "$COMPOSE_FILE" ]; then
              echo "❌ Error: Neither docker-compose.yml nor docker-compose.hub.yml found in $(pwd)"
              exit 1
            fi

            echo "📦 Using Compose configuration: ${COMPOSE_FILE}"

            # 1. Pull ONLY the newly built images
            echo "📥 Pulling updated image(s): ${TARGET_SERVICES}..."
            docker compose -f "${COMPOSE_FILE}" pull ${TARGET_SERVICES}

            # 2. Rolling restart ONLY the updated containers without touching dependencies
            echo "🔄 Restarting container(s): ${TARGET_SERVICES}..."
            docker compose -f "${COMPOSE_FILE}" up -d --no-deps ${TARGET_SERVICES}

            # 3. Health check ping on Port 81
            echo "🔍 Verifying gateway health on port 81..."
            sleep 4
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:81/ || echo "000")
            echo "Gateway response: HTTP ${HTTP_CODE}"

            # 4. Prune dangling image layers from previous build
            echo "🧹 Cleaning up dangling Docker image layers..."
            docker image prune -f

            echo "=========================================="
            echo "✅ Deployment completed successfully!"
            echo "=========================================="


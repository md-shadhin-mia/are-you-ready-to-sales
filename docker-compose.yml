services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_platform}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: platform-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6382}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: platform-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    container_name: platform-minio-setup
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/platform-media || true;
      /usr/bin/mc anonymous set download myminio/platform-media;
      exit 0;
      "

  # ── Cloudflare quick tunnels (opt-in: `docker compose --profile tunnels up -d`) ──
  # Exposes the dev servers running on the host via random *.trycloudflare.com URLs.
  # Host networking lets the containers reach the dev servers on 127.0.0.1.
  # The API is not tunneled: each frontend proxies /api to localhost:4000 itself.
  # Print the URLs with `pnpm tunnel:urls`.
  tunnel-storefront:
    image: cloudflare/cloudflared:latest
    container_name: platform-tunnel-storefront
    profiles: ["tunnels"]
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate --url http://localhost:3000

  tunnel-student:
    image: cloudflare/cloudflared:latest
    container_name: platform-tunnel-student
    profiles: ["tunnels"]
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate --url http://localhost:3001

  tunnel-admin:
    image: cloudflare/cloudflared:latest
    container_name: platform-tunnel-admin
    profiles: ["tunnels"]
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate --url http://localhost:3002

volumes:
  postgres_data:
  redis_data:
  minio_data:

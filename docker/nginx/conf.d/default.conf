# Upstream clusters on internal Docker network
upstream api_backend {
    server api:4000;
    keepalive 32;
}

upstream storefront_backend {
    server storefront:3000;
    keepalive 32;
}

upstream student_backend {
    server student-dashboard:80;
    keepalive 16;
}

upstream admin_backend {
    server admin-dashboard:80;
    keepalive 16;
}

upstream minio_backend {
    server minio:9000;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# 1. Admin Portal Subdomain Virtual Host (e.g., admin.platform.local, admin.yourdomain.com)
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name ~^admin\..+$;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        proxy_pass http://admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

